name = "willchow66-visitor-map"
main = "worker.mjs"
compatibility_date = "2026-09-06"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "willchow66-visitor-map"
# Fill in the actual UUID printed by `wrangler d1 create`; no database exists yet.
database_id = ""

# This is a chosen rate-limit namespace, NOT an existing resource ID.
# Choose a different positive integer string if already used in your account.
[[ratelimits]]
name = "HIT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
